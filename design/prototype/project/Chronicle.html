<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Chronicle of Aelmere — A World</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=IM+Fell+DW+Pica:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Spectral:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  /* ─── Tokens ──────────────────────────────────────────── */
  :root{
    /* Palette — grimdark warm parchment, ink, oxblood */
    --paper:        oklch(0.945 0.018 78);
    --paper-deep:   oklch(0.905 0.030 75);
    --paper-edge:   oklch(0.870 0.038 70);
    --paper-fold:   oklch(0.825 0.045 65);

    --ink:          oklch(0.205 0.014 50);
    --ink-soft:     oklch(0.345 0.014 50);
    --ink-faint:    oklch(0.520 0.014 50);
    --ink-ghost:    oklch(0.680 0.012 55);

    --rule:         oklch(0.560 0.020 60);

    --accent:       oklch(0.420 0.110 25);   /* oxblood */
    --accent-deep:  oklch(0.330 0.110 25);
    --accent-soft:  oklch(0.620 0.080 25);

    --gilt:         oklch(0.620 0.090 80);   /* tarnished gold */
    --moss:         oklch(0.460 0.050 130);  /* used very rarely */

    /* Type */
    --serif:    'Sorts Mill Goudy', 'EB Garamond', Georgia, serif;
    --display:  'IM Fell English', 'IM Fell DW Pica', 'Sorts Mill Goudy', Georgia, serif;
    --display-sc: 'IM Fell English SC', 'Cormorant SC', 'IM Fell English', serif;
    --mono:     'iA Writer Mono', 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;

    /* Density (overridden by tweak) */
    --measure: 62ch;
    --leading: 1.65;
    --para-gap: 0.85em;

    --foxing-opacity: 0.55;
    --texture-opacity: 0.55;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: var(--serif);
    color: var(--ink);
    background: var(--paper);
    font-size: 18px;
    line-height: var(--leading);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "kern", "liga", "onum", "pnum";
  }

  /* ─── Manuscript paper surface ─────────────────────────── */
  .paper{
    position: relative;
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at 18% 8%, rgba(80,40,10,0.05), transparent 55%),
      radial-gradient(ellipse at 82% 92%, rgba(80,40,10,0.06), transparent 55%),
      radial-gradient(ellipse at 95% 12%, rgba(120,60,20,0.04), transparent 60%);
  }
  .paper::before{
    /* parchment fiber + grain */
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 0.32  0 0 0 0 0.20  0 0 0 0 0.08  0 0 0 0.18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-size: 320px 320px;
    mix-blend-mode: multiply;
    opacity: var(--texture-opacity);
  }
  .paper::after{
    /* foxing — random brown spots */
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(circle at 12% 22%, rgba(98,52,18,0.18) 0, transparent 0.6%),
      radial-gradient(circle at 71% 8%,  rgba(110,60,20,0.14) 0, transparent 0.4%),
      radial-gradient(circle at 33% 64%, rgba(98,52,18,0.12) 0, transparent 0.5%),
      radial-gradient(circle at 88% 41%, rgba(110,60,20,0.16) 0, transparent 0.5%),
      radial-gradient(circle at 6% 78%,  rgba(98,52,18,0.10) 0, transparent 0.4%),
      radial-gradient(circle at 54% 89%, rgba(110,60,20,0.14) 0, transparent 0.4%),
      radial-gradient(circle at 24% 44%, rgba(98,52,18,0.10) 0, transparent 0.3%),
      radial-gradient(circle at 91% 72%, rgba(110,60,20,0.12) 0, transparent 0.4%),
      radial-gradient(circle at 47% 30%, rgba(98,52,18,0.10) 0, transparent 0.3%),
      radial-gradient(circle at 64% 56%, rgba(110,60,20,0.10) 0, transparent 0.3%);
    background-size: 100% 100%;
    opacity: var(--foxing-opacity);
  }

  /* deckled / torn edges */
  .deckled{
    --deckle-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='40' preserveAspectRatio='none'><filter id='d'><feTurbulence type='fractalNoise' baseFrequency='0.04 0.9' numOctaves='2' seed='7'/><feDisplacementMap in='SourceGraphic' scale='14'/></filter><rect x='0' y='0' width='1200' height='40' fill='black' filter='url(%23d)'/></svg>");
  }
  .deckled.deckled-on{
    -webkit-mask-image:
      linear-gradient(black, black),
      var(--deckle-mask),
      var(--deckle-mask);
    -webkit-mask-position: 0 20px, 0 0, 0 100%;
    -webkit-mask-size: 100% calc(100% - 40px), 100% 20px, 100% 20px;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-composite: source-over;
    mask-image:
      linear-gradient(black, black),
      var(--deckle-mask),
      var(--deckle-mask);
    mask-position: 0 20px, 0 0, 0 100%;
    mask-size: 100% calc(100% - 40px), 100% 20px, 100% 20px;
    mask-repeat: no-repeat;
    mask-composite: add;
  }

  /* ─── Type primitives ──────────────────────────────────── */
  .display{ font-family: var(--display); font-weight: 400; letter-spacing: 0.005em; }
  .display-sc{ font-family: var(--display-sc); letter-spacing: 0.08em; text-transform: lowercase; }
  .mono{ font-family: var(--mono); font-variant-ligatures: none; }
  .smallcaps{ font-variant: all-small-caps; letter-spacing: 0.12em; }
  .italic{ font-style: italic; }

  h1,h2,h3,h4{ font-family: var(--display); font-weight: 400; line-height: 1.15; margin: 0; }
  h1{ font-size: clamp(40px, 5.6vw, 80px); }
  h2{ font-size: 34px; }
  h3{ font-size: 22px; }
  p{ margin: 0 0 var(--para-gap) 0; text-wrap: pretty; hyphens: auto; }

  a{ color: inherit; text-decoration: none; }
  a.inline-link{
    border-bottom: 0.5px dotted var(--ink-ghost);
    transition: border-color 120ms ease, color 120ms ease;
    cursor: pointer;
  }
  a.inline-link:hover{ border-bottom: 1px solid var(--ink-soft); color: var(--ink); }
  a.inline-link.character{ border-bottom-color: rgba(140,40,30,0.35); }
  a.inline-link.character:hover{ border-bottom: 1px solid var(--accent); color: var(--accent-deep); }
  a.inline-link.place{ font-style: italic; }
  a.inline-link.place:hover    { border-bottom: 1px solid var(--ink-soft); }
  a.inline-link.thread{ border-bottom-color: var(--accent-soft); color: var(--accent-deep); }
  a.inline-link.thread:hover   { border-bottom: 1px solid var(--accent-deep); color: var(--accent-deep); }

  /* drop cap */
  .dropcap::first-letter{
    font-family: var(--display);
    float: left;
    font-size: 5.6em;
    line-height: 0.86;
    padding: 0.06em 0.12em 0 0;
    margin-right: 0.04em;
    color: var(--accent-deep);
    font-weight: 400;
    text-shadow: 0.5px 0 0 var(--accent-deep);
  }
  .dropcap-illum{
    position: relative;
  }
  .dropcap-illum::first-letter{
    font-family: var(--display);
    float: left;
    font-size: 6em;
    line-height: 0.84;
    padding: 0.04em 0.16em 0.04em 0.10em;
    margin: 0.06em 0.18em 0 0;
    color: var(--accent-deep);
    background:
      radial-gradient(ellipse at 30% 30%, rgba(212,175,90,0.32), transparent 65%),
      var(--paper-deep);
    border: 0.5px solid var(--accent-deep);
    box-shadow:
      inset 0 0 0 2px var(--paper-deep),
      inset 0 0 0 2.5px var(--accent-deep);
  }
  .no-dropcap::first-letter{ all: revert; }

  /* fleurons / ornaments */
  .fleuron{
    text-align:center; color: var(--ink-soft);
    font-family: var(--display); font-size: 22px; line-height: 1;
    letter-spacing: 0.6em; padding: 0.4em 0; user-select:none;
  }
  .rule{ height:1px; background: var(--rule); opacity:.45; border:0; }
  .rule-double{
    height: 5px; border:0;
    background:
      linear-gradient(var(--rule), var(--rule)) 0 0/100% 1px no-repeat,
      linear-gradient(var(--rule), var(--rule)) 0 100%/100% 1px no-repeat;
    opacity:.5;
  }

  /* ─── Layout shell ─────────────────────────────────────── */
  .app{ min-height: 100vh; }
  .nav{
    position: sticky; top: 0; z-index: 50;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 14px 28px;
    background: linear-gradient(to bottom, rgba(245,238,222,0.94), rgba(245,238,222,0.86));
    backdrop-filter: blur(6px);
    border-bottom: 0.5px solid rgba(0,0,0,0.12);
  }
  .nav-left, .nav-right{ display:flex; align-items:center; gap: 18px; }
  .nav-right{ justify-content: flex-end; }
  .nav-title{
    font-family: var(--display); font-size: 20px; letter-spacing: 0.02em;
    text-align:center; color: var(--ink);
  }
  .nav-title .small{
    display:block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink-faint); margin-top: 2px;
  }
  .nav-link{
    font-family: var(--display); font-size: 14.5px; letter-spacing: 0.04em;
    color: var(--ink-soft); cursor: pointer;
    border-bottom: 0.5px dotted var(--ink-ghost); padding-bottom: 1px;
    transition: color 120ms, border-color 120ms;
  }
  .nav-link:hover{ color: var(--accent-deep); border-bottom: 1px solid var(--accent); }
  .nav-link.is-active{ color: var(--ink); border-bottom: 1px solid var(--accent); }

  /* ─── Buttons ──────────────────────────────────────────── */
  .btn{
    appearance:none; border:0; background:transparent; cursor:pointer;
    font-family: var(--display); font-size: 15px; letter-spacing: 0.04em;
    color: var(--ink); padding: 11px 20px;
    border: 1px solid var(--ink); border-radius: 0;
    background: rgba(0,0,0,0.03);
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform 80ms, box-shadow 80ms, background 120ms, color 120ms;
  }
  .btn:hover{ background: var(--ink); color: var(--paper); transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--accent-deep); }
  .btn:active{ transform: translate(1px,1px); box-shadow: 0 0 0 var(--ink); }
  .btn-primary{
    background: var(--accent); color: var(--paper);
    border-color: var(--accent-deep);
    box-shadow: 2px 2px 0 var(--ink);
  }
  .btn-primary:hover{ background: var(--accent-deep); color: var(--paper); box-shadow: 3px 3px 0 var(--ink); }
  .btn-ghost{ border-color: rgba(0,0,0,0.18); box-shadow: none; }

  /* Tags now read as buttons when interactive */
  .tag{ cursor: default; transition: background 120ms, border-color 120ms, color 120ms; }
  .tag.clickable{ cursor: pointer; }
  .tag.clickable:hover{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .tag.accent.clickable:hover{ background: var(--accent-deep); color: var(--paper); border-color: var(--accent-deep); }

  /* Hoverable cards lift slightly */
  .card.clickable{ cursor: pointer; transition: transform 120ms, box-shadow 120ms, border-color 120ms; }
  .card.clickable:hover{
    transform: translate(-2px,-2px);
    box-shadow: 4px 4px 0 var(--ink-soft);
    border-color: var(--ink);
  }

  /* Generic clickable rows in lists */
  .row-link{ cursor: pointer; transition: background 100ms; }
  .row-link:hover{ background: rgba(120,40,30,0.05); }

  /* ─── Containers ──────────────────────────────────────── */
  .page{ max-width: 1280px; margin: 0 auto; padding: 56px 64px 120px; }
  .page-narrow{ max-width: 760px; }
  .page-wide{ max-width: 1320px; }
  .read-col{ max-width: var(--measure); margin-inline: auto; }

  /* shared chip */
  .chip{
    display:inline-flex; align-items:center; gap: 6px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .chip .dot{ width:6px; height:6px; border-radius: 50%; background: var(--ink-faint); }

  /* tags small caps */
  .tag{
    display:inline-block; font-family: var(--display-sc); font-size: 12.5px;
    letter-spacing: 0.16em; color: var(--ink-soft);
    border: 0.5px solid var(--ink-ghost); padding: 3px 10px; border-radius: 999px;
    background: rgba(255,255,255,0.18);
  }
  .tag.accent{ color: var(--accent-deep); border-color: var(--accent-soft); }

  /* card */
  .card{
    background: var(--paper-deep);
    border: 0.5px solid rgba(0,0,0,0.12);
    padding: 20px 22px;
  }

  /* utilities */
  .row{ display:flex; gap: 16px; align-items:center; }
  .stack{ display:flex; flex-direction:column; gap: 12px; }
  .grow{ flex: 1; }
  .center{ display:flex; align-items:center; justify-content:center; }

  /* placeholder image */
  .ph{
    background-color: var(--paper-deep);
    background-image:
      repeating-linear-gradient(
        45deg,
        transparent 0 8px,
        rgba(0,0,0,0.05) 8px 9px
      );
    border: 0.5px solid rgba(0,0,0,0.18);
    color: var(--ink-faint);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  }

  /* hide selection range visual */
  ::selection{ background: rgba(120,40,30,0.18); color: var(--ink); }

  /* density modifiers (set on body) */
  body.density-compact{ --leading: 1.5; --para-gap: 0.55em; --measure: 60ch; font-size: 17px; }
  body.density-airy   { --leading: 1.85; --para-gap: 1.1em; --measure: 64ch; font-size: 19px; }

  /* tone palette swaps */
  body.tone-folkloric{
    --paper: oklch(0.955 0.030 95);
    --paper-deep: oklch(0.915 0.040 90);
    --accent: oklch(0.480 0.090 60);
    --accent-deep: oklch(0.380 0.090 60);
  }
  body.tone-romantic{
    --paper: oklch(0.945 0.022 30);
    --paper-deep: oklch(0.910 0.030 25);
    --accent: oklch(0.460 0.110 10);
    --accent-deep: oklch(0.360 0.120 10);
  }
  body.tone-mythic{
    --paper: oklch(0.940 0.018 240);
    --paper-deep: oklch(0.895 0.028 240);
    --accent: oklch(0.430 0.100 250);
    --accent-deep: oklch(0.330 0.110 255);
  }

  /* type pairing swap */
  body.type-classical{
    --serif: 'EB Garamond', Georgia, serif;
    --display: 'Cormorant Garamond', 'EB Garamond', serif;
    --display-sc: 'Cormorant SC', 'EB Garamond', serif;
  }
  body.type-modern{
    --serif: 'Spectral', Georgia, serif;
    --display: 'Cormorant Garamond', 'Spectral', serif;
    --display-sc: 'Cormorant SC', 'Spectral', serif;
  }

  /* admin override — completely different */
  body.admin-mode{
    background: #0e0d0b;
    color: #c8c2b1;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.55;
  }
  body.admin-mode .paper::before,
  body.admin-mode .paper::after{ display:none; }

</style>

</head>
